apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberesue-app
  namespace: kuberesue
  labels:
    app: kuberesue-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: kuberesue-app

  template:
    metadata:
      labels:
        app: kuberesue-app

    spec:
      containers:
        - name: kuberesue-app
          image: nginx:this-image-does-not-exist

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3